<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Illustration of editing local display aliases in KubeBar"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d34"/><stop offset="1" stop-color="#183f49"/></linearGradient></defs><rect x="0" y="0" width="960" height="560" rx="20" fill="url(#bg)"/><text x="48" y="67" fill="#75d8d1" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">SHORT NAMES. SAME CONTEXTS.</text><text x="48" y="110" fill="#e8edf7" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="34" font-weight="600">Make the menu yours.</text><rect x="130" y="145" width="700" height="351" rx="14" fill="#f1f3f6"/><text x="160" y="184" fill="#172030" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="21" font-weight="600">Edit context aliases</text><text x="160" y="214" fill="#626d7c" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">Choose a display name. Leave it blank to use the original.</text><text x="160" y="248" fill="#626d7c" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">example-development-cluster</text><rect x="160" y="258" width="640" height="35" rx="5" fill="#ffffff"/><text x="172" y="282" fill="#172030" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">dev</text><text x="160" y="326" fill="#626d7c" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">example-staging-cluster</text><rect x="160" y="336" width="640" height="35" rx="5" fill="#ffffff"/><text x="172" y="360" fill="#172030" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">staging</text><text x="160" y="423" fill="#626d7c" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Saved locally. Your kubeconfig names stay unchanged.</text><rect x="607" y="449" width="90" height="30" rx="6" fill="#dfe4ec"/><text x="627" y="470" fill="#253044" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">Cancel</text><rect x="708" y="449" width="92" height="30" rx="6" fill="#2468dc"/><text x="738" y="470" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">Save</text><text x="130" y="529" fill="#aebfd2" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">Illustration · Example contexts</text></svg>